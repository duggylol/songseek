appId: gg.songseek.app
productName: SongSeek

# Auto-updates are pulled from this repo's GitHub Releases (electron-updater).
publish:
  provider: github
  owner: duggylol
  repo: songseek

# Use the castlabs Widevine-enabled Electron build for packaging.
electronVersion: 42.5.2+wvcus
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - src/main/**
  - app-config.json
  - package.json

# Bundle only the CURRENT platform's yt-dlp binary (YouTube audio) — shipping
# the other platform's copy bloated installers and every auto-update by ~36MB.

npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/bin/win32-x64
      to: bin/win32-x64

# Step-by-step install wizard (welcome → install location → progress → launch).
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SongSeek
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: SongSeek-Setup-${version}.${ext}

mac:
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin/darwin-arm64
  target:
    - target: dmg
  category: public.app-category.music
  # No Apple Developer cert needed for local testing (unsigned build).
  identity: null
